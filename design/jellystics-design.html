<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellystics Design System</title>
<style>
/* =====================================================================
   JELLYSTICS · DIRECTION B « INSTRUMENT »
   Tokens first. Every component below is written against these roles.
   ===================================================================== */
:root {
  color-scheme: light;
  /* Neutral scale (warm-neutral grey, low chroma) */
  --n-0:   #ffffff;
  --n-25:  #fcfcfb;   /* card / chart surface */
  --n-50:  #f9f9f7;   /* page plane */
  --n-100: #f0efec;
  --n-150: #e8e7e2;
  --n-200: #e1e0d9;   /* hairline grid */
  --n-300: #c3c2b7;   /* axis / strong border */
  --n-500: #898781;   /* muted ink */
  --n-700: #52514e;   /* secondary ink */
  --n-900: #0b0b0b;   /* primary ink */

  /* Roles */
  --bg:            var(--n-50);
  --surface:       var(--n-25);
  --surface-2:     var(--n-100);   /* hover, inset, track */
  --surface-3:     var(--n-150);   /* pressed / selected neutral */
  --border:        rgba(11,11,11,.10);
  --border-strong: rgba(11,11,11,.18);
  --grid:          var(--n-200);
  --axis:          var(--n-300);
  --ink:           var(--n-900);
  --ink-2:         var(--n-700);
  --ink-3:         var(--n-500);
  --ink-on-accent: #ffffff;

  /* Accent = data slot 1 (one accent only) */
  --accent:        #2a78d6;
  --accent-hover:  #256abf;
  --accent-wash:   rgba(42,120,214,.10);
  --accent-ring:   rgba(42,120,214,.35);

  /* Media types (validated categorical slots 1-3, all-pairs) */
  --t-movie:  #2a78d6;
  --t-series: #eb6834;
  --t-music:  #1baf7a;

  /* Status (reserved, always icon + label) */
  --good:     #0ca30c;  --good-ink: #006300;  --good-wash: rgba(12,163,12,.10);
  --warning:  #fab219;  --warning-ink: #8a5a00; --warning-wash: rgba(250,178,25,.14);
  --serious:  #ec835a;  --serious-ink: #a8431b; --serious-wash: rgba(236,131,90,.14);
  --critical: #d03b3b;  --critical-ink: #b12a2a; --critical-wash: rgba(208,59,59,.10);

  /* Play method: one-hue ordinal ramp (validated --ordinal). Status colors stay on badges only. */
  --m-direct: #1c5cab; --m-stream: #3987e5; --m-transcode: #86b6ef;
  --m-direct-ink: #ffffff; --m-stream-ink: #ffffff; --m-transcode-ink: #0b0b0b;

  /* Sequential blue (heatmaps) */
  --seq-0: #f0efec; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;

  /* Shape — 3 radii, nothing else */
  --r-sm: 4px;    /* badges, chips, inputs inside dense tables, bar data-ends */
  --r-md: 6px;    /* buttons, inputs, segmented, menu items, tooltips */
  --r-lg: 8px;    /* cards, panels, dialogs, posters */
  --r-full: 999px;/* avatars, dots, toggles */

  /* Spacing — 4px grid */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;

  /* Type */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 24px; --fs-hero: 48px;
  --lh-tight: 1.2; --lh: 1.45;

  /* Elevation — borders, not shadows. Shadow only for floating layers. */
  --shadow-pop: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.10);
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent-ring);

  --dur: 120ms;
  --sidebar-w: 224px;
  --topbar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
    --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.18);
    --grid: #2c2c2a; --axis: #383835;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --accent: #3987e5; --accent-hover: #5598e7; --accent-wash: rgba(57,135,229,.16); --accent-ring: rgba(57,135,229,.45);
    --t-movie: #3987e5; --t-series: #d95926; --t-music: #199e70;
    --good-ink: #3ccf3c; --warning-ink: #fab219; --serious-ink: #f09a77; --critical-ink: #ec6b6b;
    --good-wash: rgba(12,163,12,.16); --warning-wash: rgba(250,178,25,.14); --serious-wash: rgba(236,131,90,.16); --critical-wash: rgba(208,59,59,.18);
    --seq-0: #232321; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #9ec5f4;
    --m-direct: #9ec5f4; --m-stream: #5598e7; --m-transcode: #256abf; --m-direct-ink: #0b0b0b; --m-stream-ink: #0b0b0b; --m-transcode-ink: #ffffff;
    --shadow-pop: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
  --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.18);
  --grid: #2c2c2a; --axis: #383835;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
  --accent: #3987e5; --accent-hover: #5598e7; --accent-wash: rgba(57,135,229,.16); --accent-ring: rgba(57,135,229,.45);
  --t-movie: #3987e5; --t-series: #d95926; --t-music: #199e70;
  --good-ink: #3ccf3c; --warning-ink: #fab219; --serious-ink: #f09a77; --critical-ink: #ec6b6b;
  --good-wash: rgba(12,163,12,.16); --warning-wash: rgba(250,178,25,.14); --serious-wash: rgba(236,131,90,.16); --critical-wash: rgba(208,59,59,.18);
  --seq-0: #232321; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #9ec5f4;
    --m-direct: #9ec5f4; --m-stream: #5598e7; --m-transcode: #256abf; --m-direct-ink: #0b0b0b; --m-stream-ink: #0b0b0b; --m-transcode-ink: #ffffff;
  --shadow-pop: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: var(--fs-base)/var(--lh) var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1,h2,h3,h4 { margin: 0; line-height: var(--lh-tight); font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .ink2 { color: var(--ink-2); }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-md); }

/* ---------- doc shell (the design-system site itself) ---------- */
.doc-top { position: sticky; top: 0; z-index: 50; height: var(--topbar-h); display: flex; align-items: center; gap: var(--s-4); padding: 0 var(--s-5); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.doc-brand { display: flex; align-items: center; gap: var(--s-2); font-weight: 650; white-space: nowrap; }
.doc-brand .tag { font-weight: 500; font-size: var(--fs-xs); color: var(--ink-3); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 1px 6px; }
.doc-nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.doc-nav a { padding: 6px 10px; border-radius: var(--r-md); color: var(--ink-2); font-size: var(--fs-md); white-space: nowrap; }
.doc-nav a:hover { background: var(--surface-2); color: var(--ink); }
.doc-nav a[aria-current="page"] { background: var(--surface-3); color: var(--ink); font-weight: 550; }
.doc-main { max-width: 1240px; margin: 0 auto; padding: var(--s-8) var(--s-5) 96px; }
.doc-section { display: none; }
.doc-section.active { display: block; }
.doc-h1 { font-size: var(--fs-2xl); margin-bottom: var(--s-2); }
.doc-lead { color: var(--ink-2); max-width: 760px; margin-bottom: var(--s-8); }
.doc-h2 { font-size: var(--fs-lg); margin: var(--s-10) 0 var(--s-1); }
.doc-h2 + .doc-sub { color: var(--ink-3); font-size: var(--fs-md); margin-bottom: var(--s-4); max-width: 760px; }
.doc-grid { display: grid; gap: var(--s-4); }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0,1fr)); }
@media (max-width: 960px) { .g3, .g4, .g6 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 640px) { .g2, .g3, .g4, .g6 { grid-template-columns: minmax(0,1fr); } .doc-main { padding: var(--s-6) var(--s-4) 64px; } }
.spec { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); padding: var(--s-4); }
.spec-title { font-size: var(--fs-sm); color: var(--ink-3); margin-bottom: var(--s-3); display: flex; justify-content: space-between; gap: var(--s-2); }
.row { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.stack { display: flex; flex-direction: column; gap: var(--s-2); }
.note { font-size: var(--fs-sm); color: var(--ink-3); margin-top: var(--s-2); }
.rule-list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: var(--fs-md); }
.rule-list li { margin: 4px 0; }
.dont { color: var(--critical-ink); } .do { color: var(--good-ink); }

/* swatches */
.sw { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.sw-chip { height: 56px; border-bottom: 1px solid var(--border); }
.sw-meta { padding: var(--s-2) var(--s-3); font-size: var(--fs-sm); }
.sw-meta b { display: block; font-weight: 550; font-size: var(--fs-md); }
.sw-meta code { color: var(--ink-3); }

/* =====================================================================
   COMPONENTS
   ===================================================================== */
/* Button */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid transparent; font-size: var(--fs-md); font-weight: 550; cursor: pointer; transition: background var(--dur), border-color var(--dur), color var(--dur); white-space: nowrap; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-sm { height: 26px; padding: 0 8px; font-size: var(--fs-sm); }
.btn-lg { height: 38px; padding: 0 16px; font-size: var(--fs-base); }
.btn-primary { background: var(--accent); color: var(--ink-on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--surface); border-color: var(--border-strong); color: var(--critical-ink); }
.btn-danger:hover { background: var(--critical-wash); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-icon { width: 32px; padding: 0; }
.btn-icon.btn-sm { width: 26px; }

/* Inputs */
.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-md); }
.field label { color: var(--ink-2); font-weight: 500; font-size: var(--fs-sm); }
.input, .select { height: 32px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r-md); padding: 0 10px; font: inherit; font-size: var(--fs-md); color: var(--ink); width: 100%; }
.input:hover, .select:hover { border-color: var(--axis); }
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.input-wrap { position: relative; }
.input-wrap svg { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: var(--ink-3); }
.input-wrap .input { padding-left: 32px; }
.kbd { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: var(--r-sm); padding: 0 5px; background: var(--surface); }

/* Segmented control */
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border-radius: var(--r-md); border: 1px solid var(--border); }
.seg button { height: 26px; padding: 0 10px; border: 0; background: transparent; border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(0,0,0,.06); }

/* Tabs */
.tabs { display: flex; gap: var(--s-4); border-bottom: 1px solid var(--border); }
.tabs button { background: none; border: 0; padding: 10px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--ink-3); font-size: var(--fs-md); font-weight: 550; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.tabs .count { font-weight: 500; color: var(--ink-3); margin-left: 4px; }

/* Badges & chips */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--r-sm); font-size: var(--fs-xs); font-weight: 550; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.badge .dot { width: 6px; height: 6px; border-radius: var(--r-full); }
.badge svg { width: 12px; height: 12px; }
/* Status badges: neutral surface + ink text; only the icon / dot carries the status color. */
.badge.good svg, .badge.good .dot { color: var(--good-ink); background-color: currentColor; }
.badge.warning svg, .badge.warning .dot { color: var(--warning-ink); }
.badge.serious svg, .badge.serious .dot { color: var(--serious-ink); }
.badge.critical svg, .badge.critical .dot, .badge.critical .live-dot { color: var(--critical-ink); }
.badge svg { background-color: transparent !important; }
.badge.good .dot { background: var(--good); } .badge.warning .dot { background: var(--warning); } .badge.serious .dot { background: var(--serious); } .badge.critical .dot { background: var(--critical); }
.badge.accent .dot { background: var(--accent); }
.badge.new { color: var(--ink); font-size: 10px; letter-spacing: .06em; font-weight: 650; }
.badge.new .dot { background: var(--accent); }
.doc-nav .newtag { font-size: 9px; font-weight: 650; letter-spacing: .06em; color: var(--accent); margin-left: 4px; vertical-align: 1px; }
.ncard .card-b { overflow-x: auto; }
.chart text.mx-t.lo { fill: var(--ink-2); } .chart text.mx-t.hi { fill: #fff; }
:root[data-theme="dark"] .chart text.mx-t.lo { fill: #fff; } :root[data-theme="dark"] .chart text.mx-t.hi { fill: #0b0b0b; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .chart text.mx-t.lo { fill: #fff; } :root:where(:not([data-theme="light"])) .chart text.mx-t.hi { fill: #0b0b0b; } }
@media (max-width: 640px) { .ncard { grid-column: auto !important; } }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); border: 1px solid var(--border-strong); font-size: var(--fs-sm); color: var(--ink-2); background: var(--surface); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .x { opacity: .6; }
.live-dot { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--critical); box-shadow: 0 0 0 0 rgba(208,59,59,.5); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(208,59,59,.45); } 70% { box-shadow: 0 0 0 6px rgba(208,59,59,0); } 100% { box-shadow: 0 0 0 0 rgba(208,59,59,0); } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

/* Card / panel */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-4); min-height: 48px; }
.card-h h3 { font-size: var(--fs-md); font-weight: 600; }
.card-h .sub { font-size: var(--fs-sm); color: var(--ink-3); font-weight: 400; margin-top: 1px; }
.card-b { padding: 0 var(--s-4) var(--s-4); }
.card-b.flush { padding: 0; overflow-x: auto; }
.card { min-width: 0; }
.tree { max-width: 100%; }
.card-f { border-top: 1px solid var(--border); padding: var(--s-2) var(--s-4); font-size: var(--fs-sm); color: var(--ink-3); display: flex; justify-content: space-between; }
.card-f a { color: var(--accent); font-weight: 550; }

/* Stat tile */
.stat { padding: var(--s-4); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stat-label { font-size: var(--fs-sm); color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.stat-value { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.stat-value small { font-size: var(--fs-md); font-weight: 500; color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }
.stat-foot { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-3); white-space: nowrap; min-width: 0; }
.stat-foot > svg { margin-left: auto; flex: none; }
.stat-foot > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
.delta { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 2px; font-weight: 550; font-size: var(--fs-sm); }
.delta.up { color: var(--good-ink); } .delta.down { color: var(--critical-ink); } .delta.flat { color: var(--ink-3); }
.stat.selectable { cursor: pointer; border-bottom: 2px solid transparent; }
.stat.selectable:hover { background: var(--surface-2); }
.stat.selected { border-bottom-color: var(--accent); }
.stat-strip { display: grid; grid-template-columns: repeat(var(--n,4), minmax(0,1fr)); }
.stat-strip > .stat + .stat { border-left: 1px solid var(--border); }
@media (max-width: 800px) { .stat-strip { grid-template-columns: repeat(2, minmax(0,1fr)); } .stat-strip > .stat:nth-child(odd) { border-left: 0; } .stat-strip > .stat:nth-child(n+3) { border-top: 1px solid var(--border); } }

/* Bar list (top-N rows with a background bar) */
.barlist { display: flex; flex-direction: column; }
.barlist-row { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: var(--s-3); height: 38px; padding: 0 var(--s-2); border-radius: var(--r-md); cursor: pointer; }
.barlist-label .art.poster { width: 20px; } .barlist-label .art.square { width: 26px; } .barlist-label .art { font-size: 8px; }
.barlist-row:hover { background: var(--surface-2); }
.barlist-fill { position: absolute; left: 0; top: 4px; bottom: 4px; border-radius: var(--r-sm); background: var(--accent-wash); }
.barlist-label { position: relative; display: flex; align-items: center; gap: var(--s-2); min-width: 0; font-size: var(--fs-md); }
.barlist-label span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barlist-value { position: relative; font-size: var(--fs-md); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.barlist-head { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; padding: 0 var(--s-2) var(--s-1); }

/* Table */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.table th { text-align: left; font-weight: 550; font-size: var(--fs-sm); color: var(--ink-3); padding: 8px var(--s-4); border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.table th.sortable { cursor: pointer; } .table th.sortable:hover { color: var(--ink); }
.table th .arrow { opacity: .6; margin-left: 2px; }
.table td { padding: 0 var(--s-4); height: 44px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { cursor: pointer; } .table tbody tr:hover td { background: var(--surface-2); }
.table td.r, .table th.r { text-align: right; }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table .cell-media { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }

/* ---------- chart helpers ---------- */
const niceMax = (v) => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
// rounded-top bar path (4px data-end, square baseline)
const barPath = (x, y, w, h, r = 4) => { if (h <= 0) return ''; r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
const barPathH = (x, y, w, h, r = 4) => { if (w <= 0) return ''; r = Math.min(r, w, h / 2); return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`; };

/* Line / area over time. series: [{name,color,values,dash?}] */
function lineChart({ labels, series, height = 220, yFmt = fmtN, area = true, width = 720, xEvery = 5, compare }) {
  const m = { t: 10, r: 12, b: 26, l: 46 };
  const iw = width - m.l - m.r, ih = height - m.t - m.b;
  const all = series.flatMap((s) => s.values).concat(compare ? compare.values : []);
  const ymax = niceMax(Math.max(...all) * 1.05);
  const x = (i) => m.l + (labels.length === 1 ? iw / 2 : (i * iw) / (labels.length - 1));
  const y = (v) => m.t + ih - (v / ymax) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = (ymax * k) / 4, yy = y(v); g += `<line x1="${m.l}" x2="${width - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 8}" y="${yy + 3.5}" text-anchor="end">${yFmt(v)}</text>`; }
  g += `<line x1="${m.l}" x2="${width - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  labels.forEach((l, i) => { if (i % xEvery === 0 || (i === labels.length - 1 && i % xEvery >= xEvery / 2)) g += `<text x="${x(i)}" y="${height - 8}" text-anchor="middle">${esc(l)}</text>`; });
  const path = (vals) => vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  if (compare) g += `<path d="${path(compare.values)}" fill="none" stroke="var(--axis)" stroke-width="1.5"/>`;
  series.forEach((s) => {
    if (area) g += `<path d="${path(s.values)}L${x(s.values.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.color}" opacity=".10"/>`;
    g += `<path d="${path(s.values)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v, i) => { g += `<circle class="pt" data-x="${i}" cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2" style="opacity:0"/>`; });
    const last = s.values.length - 1;
    g += `<circle cx="${x(last)}" cy="${y(s.values[last])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  g += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`;
  const step = iw / Math.max(1, labels.length - 1);
  labels.forEach((l, i) => {
    const rows = series.map((s) => [s.color, s.name, yFmt(s.values[i])]);
    if (compare) rows.push(['var(--axis)', compare.name, yFmt(compare.values[i])]);
    g += `<rect data-x="${i}" data-cx="${x(i)}" x="${x(i) - step / 2}" y="${m.t}" width="${step}" height="${ih}" fill="transparent" data-tip="${tipData(l, rows)}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(series.map((s) => s.name).join(', '))}">${g}</svg></div><style>.xhair{opacity:0}.xhair.on{opacity:1}</style>`;
}

/* Stacked columns. series: [{name,color,values}] */
function stackedColumns({ labels, series, height = 220, width = 720, yFmt = fmtN, xEvery = 5 }) {
  const m = { t: 10, r: 8, b: 26, l: 46 };
  const iw = width - m.l - m.r, ih = height - m.t - m.b;
  const totals = labels.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const ymax = niceMax(Math.max(...totals) * 1.05);
  const band = iw / labels.length, bw = Math.min(24, band - 2);
  const y = (v) => m.t + ih - (v / ymax) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = (ymax * k) / 4, yy = y(v); g += `<line x1="${m.l}" x2="${width - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${yy + 3.5}" text-anchor="end">${yFmt(v)}</text>`; }
  labels.forEach((l, i) => {
    const cx = m.l + band * i + band / 2, x0 = cx - bw / 2;
    let acc = 0;
    series.forEach((s, si) => {
      const v = s.values[i]; if (!v) return;
      const top = si === series.length - 1;
      const y1 = y(acc + v), y0 = y(acc), h = y0 - y1 - (acc > 0 ? 2 : 0);
      g += top ? `<path d="${barPath(x0, y1, bw, h)}" fill="${s.color}"/>` : `<rect x="${x0}" y="${y1}" width="${bw}" height="${Math.max(0, h)}" fill="${s.color}"/>`;
      acc += v;
    });
    g += `<rect x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" data-tip="${tipData(l, series.map((s) => [s.color, s.name, yFmt(s.values[i])]).concat([[null, 'Total', yFmt(totals[i])]]))}"/>`;
    if (i % xEvery === 0 || (i === labels.length - 1 && i % xEvery >= xEvery / 2)) g += `<text x="${cx}" y="${height - 8}" text-anchor="middle">${esc(l)}</text>`;
  });
  g += `<line x1="${m.l}" x2="${width - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img">${g}</svg></div>`;
}

/* Simple columns, one series. highlight index gets accent, others muted when emphasis=true */
function columns({ labels, values, height = 180, width = 720, color = 'var(--accent)', yFmt = fmtN, xEvery = 1, emphasis = -1, tipFmt, name = 'Valeur', ticks = true }) {
  const m = { t: 18, r: 8, b: 24, l: ticks ? 40 : 8 };
  const iw = width - m.l - m.r, ih = height - m.t - m.b;
  const ymax = niceMax(Math.max(...values) * 1.05);
  const band = iw / values.length, bw = Math.min(24, band - 2);
  const y = (v) => m.t + ih - (v / ymax) * ih;
  let g = '';
  if (ticks) for (let k = 0; k <= 5; k++) { const v = (ymax * k) / 5, yy = y(v); g += `<line x1="${m.l}" x2="${width - m.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${yy + 3.5}" text-anchor="end">${yFmt(v)}</text>`; }
  values.forEach((v, i) => {
    const cx = m.l + band * i + band / 2;
    const c = emphasis >= 0 && i !== emphasis ? 'color-mix(in srgb, var(--accent) 35%, var(--surface-3))' : color;
    g += `<path d="${barPath(cx - bw / 2, y(v), bw, y(0) - y(v))}" fill="${c}"/>`;
    if (i === emphasis) g += `<text class="lbl-strong" x="${cx}" y="${y(v) - 6}" text-anchor="middle">${yFmt(v)}</text>`;
    g += `<rect x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" data-tip="${tipData(labels[i], [[c, name, (tipFmt || yFmt)(v)]])}"/>`;
    if (i % xEvery === 0) g += `<text x="${cx}" y="${height - 6}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  g += `<line x1="${m.l}" x2="${width - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img">${g}</svg></div>`;
}

/* Weekday × hour heatmap (sequential blue) */
function weekHeatmap(matrix, { width = 720, unit = 'vues' } = {}) {
  const m = { t: 4, r: 4, b: 22, l: 40 }, gap = 2;
  const cw = (width - m.l - m.r) / 24, ch = 18;
  const height = m.t + ch * 7 + m.b;
  const max = Math.max(...matrix.flat());
  const steps = ['var(--seq-0)', 'var(--seq-1)', 'var(--seq-2)', 'var(--seq-3)', 'var(--seq-4)', 'var(--seq-5)', 'var(--seq-6)'];
  let g = '';
  matrix.forEach((row, d) => {
    g += `<text x="${m.l - 8}" y="${m.t + d * ch + ch / 2 + 3.5}" text-anchor="end">${DAYS[d]}</text>`;
    row.forEach((v, h) => {
      const idx = v === 0 ? 0 : Math.min(6, 1 + Math.floor((v / max) * 5.999));
      g += `<rect x="${m.l + h * cw}" y="${m.t + d * ch}" width="${cw - gap}" height="${ch - gap}" rx="2" fill="${steps[idx]}" data-tip="${tipData(`${DAYS_FULL[d]} · ${fmtHour(h)}`, [[null, unit, fmtN(v)]])}"/>`;
    });
  });
  [0, 6, 12, 18, 23].forEach((h) => { g += `<text x="${m.l + h * cw + cw / 2}" y="${height - 6}" text-anchor="middle">${fmtHour(h)}</text>`; });
  const legend = `<div class="row" style="gap:6px;font-size:var(--fs-xs);color:var(--ink-3);justify-content:flex-end;margin-top:6px">Moins ${steps.map((s) => `<span style="width:12px;height:12px;border-radius:2px;background:${s};display:inline-block"></span>`).join('')} Plus</div>`;
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Activité par jour et heure">${g}</svg></div>${legend}`;
}

/* Calendar heatmap (52 weeks) with streak */
function calendarHeatmap(values, { width = 720 } = {}) {
  const weeks = Math.ceil(values.length / 7), m = { t: 16, l: 28, b: 4 }, gap = 2;
  const cw = (width - m.l) / weeks;
  const height = m.t + cw * 7 + m.b;
  const max = Math.max(...values);
  const steps = ['var(--seq-0)', 'var(--seq-1)', 'var(--seq-2)', 'var(--seq-3)', 'var(--seq-4)', 'var(--seq-5)'];
  let g = '';
  const start = new Date(TODAY); start.setDate(start.getDate() - values.length + 1);
  values.forEach((v, i) => {
    const w = Math.floor(i / 7), d = i % 7;
    const day = new Date(start); day.setDate(start.getDate() + i);
    const idx = v === 0 ? 0 : Math.min(5, 1 + Math.floor((v / max) * 4.999));
    g += `<rect x="${m.l + w * cw}" y="${m.t + d * cw}" width="${cw - gap}" height="${cw - gap}" rx="2" fill="${steps[idx]}" data-tip="${tipData(`${DAYS_FULL[d]} ${fmtDay(day)}`, [[null, 'Temps de lecture', v ? fmtDur(v) : '—']])}"/>`;
    if (d === 0 && day.getDate() <= 7) g += `<text x="${m.l + w * cw}" y="${m.t - 5}">${MONTHS[day.getMonth()]}</text>`;
  });
  [0, 2, 4].forEach((d) => { g += `<text x="${m.l - 6}" y="${m.t + d * cw + cw - 4}" text-anchor="end">${DAYS[d]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${m.l + weeks * cw} ${height}" role="img" aria-label="Calendrier d'activité">${g}</svg></div>`;
}

/* Thin horizontal bars ranked (bar list HTML, the workhorse) */
function barList(rows, { head = ['', ''], fmt = fmtN, color = 'var(--accent-wash)', max } = {}) {
  const mx = max || Math.max(...rows.map((r) => r.value));
  return `<div class="barlist">${head[0] ? `<div class="barlist-head"><span>${head[0]}</span><span>${head[1]}</span></div>` : ''}${rows.map((r) => `<a class="barlist-row" href="${r.href || 'javascript:void 0'}" tabindex="0" data-tip="${tipData(r.label, [[null, head[1] || 'Valeur', fmt(r.value)]].concat(r.extra || []))}"><span class="barlist-fill" style="width:${Math.max(2, (r.value / mx) * 100)}%;background:${r.fill || color}"></span><span class="barlist-label">${r.lead || ''}<span class="t">${esc(r.label)}</span>${r.badge || ''}</span><span class="barlist-value">${fmt(r.value)}</span></a>`).join('')}</div>`;
}

/* Tall segmented bar (one whole split in parts) */
function segBar(parts, { thin = false } = {}) {
  const tot = parts.reduce((a, p) => a + p.value, 0);
  if (thin) return `<div style="display:flex;gap:2px;height:8px">${parts.map((p) => `<span style="flex:${p.value};background:${p.color};border-radius:999px" data-tip="${tipData(p.label, [[p.color, 'Part', fmtPct(p.value / tot)], [null, 'Valeur', p.fmt || fmtN(p.value)]])}"></span>`).join('')}</div>`;
  return `<div style="display:flex;gap:2px;height:28px">${parts.map((p) => { const share = p.value / tot; return `<span tabindex="0" style="flex:${p.value};background:${p.color};border-radius:4px;color:${p.ink || '#fff'};font-size:12px;font-weight:600;display:flex;align-items:center;padding:0 8px;min-width:0;overflow:visible;white-space:nowrap" data-tip="${tipData(p.label, [[p.color, 'Part', fmtPct(share)], [null, 'Valeur', p.fmt || fmtN(p.value)]])}">${share > 0.09 ? fmtPct(share) : ''}</span>`; }).join('')}</div><div class="legend" style="margin-top:8px">${parts.map((p) => `<span><i style="background:${p.color}"></i>${esc(p.label)}</span>`).join('')}</div>`;
}

/* Sparkline */
function spark(values, { width = 96, height = 28, color = 'var(--accent)' } = {}) {
  const max = Math.max(...values), min = Math.min(...values);
  const x = (i) => (i * (width - 4)) / (values.length - 1) + 2, y = (v) => height - 3 - ((v - min) / (max - min || 1)) * (height - 6);
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" aria-hidden="true"><path d="${d}" fill="none" stroke="color-mix(in srgb, ${color} 45%, var(--surface-3))" stroke-width="1.5"/><path d="${d.split('L').slice(-6).join('L').replace(/^/, 'M').replace('MM', 'M')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/><circle cx="${x(values.length - 1)}" cy="${y(values[values.length - 1])}" r="2.5" fill="${color}"/></svg>`;
}

/* Funnel (ordinal ramp, horizontal) */
function funnel(stages, { width = 720 } = {}) {
  const ramp = ['var(--seq-6)', 'var(--seq-5)', 'var(--seq-4)', 'var(--seq-3)'];
  const max = stages[0].value, rowH = 34, lw = 150, height = stages.length * rowH;
  let g = '';
  stages.forEach((s, i) => {
    const w = ((width - lw - 90) * s.value) / max, yy = i * rowH + 6;
    g += `<text class="lbl" x="0" y="${yy + 15}">${esc(s.label)}</text>`;
    g += `<path d="${barPathH(lw, yy, Math.max(2, w), 22)}" fill="${ramp[i] || ramp[3]}" data-tip="${tipData(s.label, [[ramp[i], 'Lectures', fmtN(s.value)], [null, 'vs étape 1', fmtPct(s.value / max)]])}"/>`;
    g += `<text class="lbl-strong" x="${lw + w + 8}" y="${yy + 15}">${fmtN(s.value)}</text><text x="${lw + w + 8 + String(fmtN(s.value)).length * 7 + 8}" y="${yy + 15}">${i ? fmtPct(s.value / max) : ''}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Entonnoir de complétion">${g}</svg></div>`;
}

/* Episode drop-off: viewers per episode, season separators */
function dropoff(seasons, { width = 720, height = 200 } = {}) {
  const m = { t: 18, r: 12, b: 28, l: 40 };
  const pts = []; seasons.forEach((s, si) => s.forEach((v, ei) => pts.push({ v, si, ei })));
  const iw = width - m.l - m.r, ih = height - m.t - m.b, ymax = niceMax(Math.max(...pts.map((p) => p.v)));
  const x = (i) => m.l + (i * iw) / (pts.length - 1), y = (v) => m.t + ih - (v / ymax) * ih;
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = (ymax * k) / 3; g += `<line x1="${m.l}" x2="${width - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${y(v) + 3.5}" text-anchor="end">${fmtN(v)}</text>`; }
  let idx = 0;
  seasons.forEach((s, si) => {
    const x0 = x(idx), x1 = x(idx + s.length - 1);
    if (si) g += `<line x1="${x0 - (iw / (pts.length - 1)) / 2}" x2="${x0 - (iw / (pts.length - 1)) / 2}" y1="${m.t}" y2="${y(0)}" stroke="var(--axis)"/>`;
    g += `<text x="${(x0 + x1) / 2}" y="${height - 8}" text-anchor="middle">Saison ${si + 1}</text>`;
    idx += s.length;
  });
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.v)}`).join('');
  g += `<path d="${d}L${x(pts.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--t-series)" opacity=".10"/><path d="${d}" fill="none" stroke="var(--t-series)" stroke-width="2" stroke-linejoin="round"/>`;
  g += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${y(0)}" stroke="var(--axis)"/>`;
  const step = iw / (pts.length - 1);
  pts.forEach((p, i) => {
    g += `<circle class="pt" data-x="${i}" cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--t-series)" stroke="var(--surface)" stroke-width="2" style="opacity:0"/>`;
    g += `<rect data-x="${i}" data-cx="${x(i)}" x="${x(i) - step / 2}" y="${m.t}" width="${step}" height="${ih}" fill="transparent" data-tip="${tipData(`S${p.si + 1} · É${p.ei + 1}`, [['var(--t-series)', 'Spectateurs', fmtN(p.v)], [null, 'vs S1É1', fmtPct(p.v / pts[0].v)]])}"/>`;
  });
  const last = pts.length - 1;
  g += `<circle cx="${x(last)}" cy="${y(pts[last].v)}" r="4" fill="var(--t-series)" stroke="var(--surface)" stroke-width="2"/><text class="lbl-strong" x="${width - m.r}" y="${m.t - 4}" text-anchor="end">${fmtPct(pts[last].v / pts[0].v)} de rétention</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Rétention par épisode">${g}</svg></div>`;
}

/* Stop-position histogram over a runtime (where people quit) */
function stopHistogram(bins, runtimeMin, { width = 720, height = 160 } = {}) {
  const labels = bins.map((_, i) => `${Math.round((i * runtimeMin) / bins.length)} min`);
  return columns({ labels, values: bins, height, width, color: 'var(--accent)', xEvery: Math.ceil(bins.length / 6), name: 'Arrêts', emphasis: bins.length - 1 });
}

    ${spec('Principe 1', '<b>Un seul accent.</b><p class="note">Le bleu porte l’action et la série unique. Tout le reste est en niveaux de gris.</p>')}
    ${spec('Principe 2', '<b>Bordures, pas d’ombres.</b><p class="note">1 px à 10 % d’encre. L’ombre est réservée à ce qui flotte (menus, dialogues, infobulles).</p>')}
    ${spec('Principe 3', '<b>Chaque chiffre a un contexte.</b><p class="note">Une unité, une période nommée, et si possible une comparaison.</p>')}
  </div>

  <h2 class="doc-h2">Neutres</h2><p class="doc-sub">Gris chaud très peu saturé. Les rôles (fond, surface, bordure, encre) pointent vers ces pas ; le mode sombre a ses propres pas, pas une inversion automatique.</p>
  <div class="doc-grid g6">${sw('Page', '--bg', '')}${sw('Surface', '--surface', '')}${sw('Survol', '--surface-2', '')}${sw('Sélection', '--surface-3', '')}${sw('Grille', '--grid', '')}${sw('Axe', '--axis', '')}</div>
  <div class="doc-grid g6" style="margin-top:var(--s-4)">${sw('Encre', '--ink', '')}${sw('Encre 2', '--ink-2', '')}${sw('Encre 3', '--ink-3', '')}${sw('Bordure', '--border', '')}${sw('Bordure forte', '--border-strong', '')}${sw('Accent', '--accent', '')}</div>

  <h2 class="doc-h2">Types de média</h2><p class="doc-sub">Les 3 premières couleurs catégorielles, validées pour le daltonisme sur toutes les paires (ΔE ≥ 9,2) en clair et en sombre. Elles identifient le type <b>partout</b> : badges, graphiques empilés, légendes. Toujours accompagnées d’un libellé (l’aqua est sous 3:1 en mode clair).</p>
  <div class="doc-grid g3">${sw('Film', '--t-movie', '#2a78d6 / #3987e5')}${sw('Série', '--t-series', '#eb6834 / #d95926')}${sw('Musique', '--t-music', '#1baf7a / #199e70')}</div>

  <h2 class="doc-h2">Statut</h2><p class="doc-sub">Réservé au sens « bon / attention / grave ». Jamais pour une série de données. Toujours avec une icône et un libellé.</p>
  <div class="doc-grid g4">${sw('Bon', '--good', '#0ca30c', 'Direct play, delta positif')}${sw('Attention', '--warning', '#fab219', 'Direct stream')}${sw('Sérieux', '--serious', '#ec835a', 'Transcodage')}${sw('Critique', '--critical', '#d03b3b', 'Erreur, live, delta négatif')}</div>

  <h2 class="doc-h2">Méthode de lecture</h2><p class="doc-sub">Dans les graphiques, la méthode de lecture est une échelle ordonnée d’une seule teinte (la plus foncée = direct play). Les couleurs de statut restent réservées aux badges et aux alertes, jamais en grands blocs.</p>
  <div class="doc-grid g3">${sw('Direct play', '--m-direct', '#1c5cab / #9ec5f4')}${sw('Direct stream', '--m-stream', '#3987e5 / #5598e7')}${sw('Transcodage', '--m-transcode', '#86b6ef / #256abf')}</div>

  <h2 class="doc-h2">Échelle séquentielle</h2><p class="doc-sub">Une seule teinte, du clair au foncé, pour l’intensité (heatmaps, calendrier). Pas d’arc-en-ciel.</p>
  <div class="spec"><div style="display:flex;gap:2px">${[0, 1, 2, 3, 4, 5, 6].map((i) => `<div style="flex:1;height:36px;border-radius:4px;background:var(--seq-${i})"></div>`).join('')}</div><div class="row" style="justify-content:space-between;margin-top:6px;font-size:var(--fs-xs);color:var(--ink-3)"><span>0</span><span>max</span></div></div>

  <h2 class="doc-h2">Typographie</h2><p class="doc-sub">La police système de chaque OS (San Francisco, Segoe UI, Roboto) : nette, rapide, zéro chargement. Chiffres tabulaires dans les colonnes et les axes, proportionnels pour les gros chiffres isolés.</p>
  ${card('', '', `<table class="table" style="cursor:default"><thead><tr><th>Rôle</th><th>Token</th><th>Taille / graisse</th><th>Exemple</th></tr></thead><tbody>${typeScale.map(([r, t, s, ex, n]) => `<tr style="cursor:default"><td>${r}${n ? `<div class="muted" style="font-size:var(--fs-sm);white-space:normal">${n}</div>` : ''}</td><td><code>${t}</code></td><td class="num">${s}</td><td style="font-size:var(${t});font-weight:${s.includes('600') ? 600 : s.includes('550') ? 550 : 400};${t === '--fs-xs' ? 'letter-spacing:.04em' : ''};white-space:normal">${ex}</td></tr>`).join('')}</tbody></table>`, { flush: true })}

  <h2 class="doc-h2">Forme, espacement, élévation</h2><p class="doc-sub">Trois radius seulement. Grille de 4 px. La hauteur standard d’un contrôle est 32 px (26 px en dense, 38 px en grand).</p>
  <div class="doc-grid g4">
    ${spec('<code>--r-sm</code> · 4 px', '<div style="height:56px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border-strong)"></div><p class="note">Badges, chips de tableau, extrémités de barres, posters &lt; 40 px.</p>')}
    ${spec('<code>--r-md</code> · 6 px', '<div style="height:56px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border-strong)"></div><p class="note">Boutons, champs, segmented, items de menu, infobulles.</p>')}
    ${spec('<code>--r-lg</code> · 8 px', '<div style="height:56px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--border-strong)"></div><p class="note">Cartes, panneaux, dialogues, menus, grands posters.</p>')}
    ${spec('<code>--r-full</code>', '<div style="height:56px;width:56px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border-strong)"></div><p class="note">Avatars, pastilles, interrupteurs, chips de filtre.</p>')}
  </div>
  <div class="doc-grid g2" style="margin-top:var(--s-4)">
    ${spec('Espacement (4 px)', `<div class="stack">${[1, 2, 3, 4, 5, 6, 8, 10, 12].map((n) => `<div class="row" style="gap:12px;font-size:var(--fs-sm)"><code style="width:44px">--s-${n}</code><span style="height:10px;width:${n * 4 * 2}px;background:var(--accent);border-radius:2px;opacity:.6"></span><span class="muted">${n * 4} px</span></div>`).join('')}</div><p class="note">Entre cartes : 16 px. Padding de carte : 16 px. Entre sections de page : 24 px.</p>`)}
    ${spec('Élévation', `<div class="stack" style="gap:12px"><div class="card" style="padding:12px;font-size:var(--fs-md)">Niveau 0 · surface + bordure 1 px (cartes, tableaux)</div><div class="pop" style="padding:12px;font-size:var(--fs-md)">Niveau 1 · ombre « pop » (menus, popovers, infobulles, dialogues)</div><p class="note">Aucun autre niveau. Pas d’ombre au survol d’une carte : le survol change le fond (<code>--surface-2</code>).</p></div>`)}
  </div>

  <h2 class="doc-h2">Iconographie & mouvement</h2><p class="doc-sub">Un seul jeu d’icônes à trait (1,6 px), 16 px dans l’UI dense, 20 px dans la navigation. Les icônes accompagnent un libellé ; seules les actions courantes (recherche, filtre, plus) peuvent être seules, avec une infobulle.</p>
  <div class="spec"><div class="row" style="gap:18px;color:var(--ink-2)">${Object.keys(ICONS).filter((k) => k !== 'logo').map((k) => `<span title="${k}" style="display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink-3);width:44px">${ic(k, 20)}${k}</span>`).join('')}</div><p class="note">Mouvement : 120 ms, ease-out, pour les changements d’état (fond, couleur). Pas d’animation d’entrée des graphiques. <code>prefers-reduced-motion</code> coupe le pulse live et les skeletons.</p></div>

  <h2 class="doc-h2">Formats</h2><p class="doc-sub">Une seule façon d’écrire chaque type de valeur, dans toute l’app (fr-FR ; les autres langues suivent leur locale).</p>
  ${card('', '', `<table class="table" style="cursor:default"><thead><tr><th>Valeur</th><th>Format</th><th>Règle</th></tr></thead><tbody>${fmtRules.map(([a, b, c]) => `<tr style="cursor:default"><td style="font-weight:550">${a}</td><td class="num">${b}</td><td style="white-space:normal;color:var(--ink-2);padding-top:8px;padding-bottom:8px">${c}</td></tr>`).join('')}</tbody></table>`, { flush: true })}
  `;
}

  <div class="doc-grid g2">
    ${spec('Variantes', `<div class="row"><button class="btn btn-primary">${ic('refresh')}Synchroniser</button><button class="btn btn-secondary">${ic('download')}Exporter</button><button class="btn btn-ghost">Annuler</button><button class="btn btn-danger">Supprimer</button></div>`)}

/* ---------- extra chart primitives ---------- */

/* Stacked area (shares over time). series: [{name,color,values}] */
function stackedArea({ labels, series, height = 220, width = 940, yFmt = fmtN, xEvery = 4 }) {
  const m = { t: 10, r: 12, b: 26, l: 46 };
  const iw = width - m.l - m.r, ih = height - m.t - m.b;
  const totals = labels.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const ymax = niceMax(Math.max(...totals) * 1.05);
  const x = (i) => m.l + (i * iw) / (labels.length - 1), y = (v) => m.t + ih - (v / ymax) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = (ymax * k) / 4; g += `<line x1="${m.l}" x2="${width - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${y(v) + 3.5}" text-anchor="end">${yFmt(v)}</text>`; }
  const acc = labels.map(() => 0);
  series.forEach((s) => {
    const lower = acc.slice(); s.values.forEach((v, i) => { acc[i] += v; });
    const top = acc.map((v, i) => `${x(i)},${y(v)}`), bot = lower.map((v, i) => `${x(i)},${y(v)}`).reverse();
    g += `<path d="M${top.join('L')}L${bot.join('L')}Z" fill="${s.color}" opacity=".85" stroke="var(--surface)" stroke-width="1.5"/>`;
  });
  labels.forEach((l, i) => { if (i % xEvery === 0) g += `<text x="${x(i)}" y="${height - 8}" text-anchor="middle">${esc(l)}</text>`; });
  const step = iw / (labels.length - 1);
  g += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${y(0)}" stroke="var(--ink-3)"/>`;
  labels.forEach((l, i) => { g += `<rect data-x="${i}" data-cx="${x(i)}" x="${x(i) - step / 2}" y="${m.t}" width="${step}" height="${ih}" fill="transparent" data-tip="${tipData(l, series.map((s) => [s.color, s.name, yFmt(s.values[i])]).reverse())}"/>`; });
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img">${g}</svg></div>`;
}

/* Generic matrix heatmap with row/col labels (sequential) */
function matrix({ rows, cols, values, width = 440, cell = 28, fmt = fmtN, unit = '', labelW = 120 }) {
  const max = Math.max(...values.flat().filter((v) => v !== null));
  const cw = Math.min(cell * 1.6, (width - labelW) / cols.length), ch = cell, top = 22;
  const height = top + rows.length * ch + 4;
  const steps = ['var(--seq-1)', 'var(--seq-2)', 'var(--seq-3)', 'var(--seq-4)', 'var(--seq-5)', 'var(--seq-6)'];
  let g = '';
  cols.forEach((c, j) => { g += `<text x="${labelW + j * cw + cw / 2}" y="14" text-anchor="middle">${esc(c)}</text>`; });
  rows.forEach((r, i) => {
    g += `<text class="lbl" x="${labelW - 8}" y="${top + i * ch + ch / 2 + 4}" text-anchor="end">${esc(r)}</text>`;
    cols.forEach((c, j) => {
      const v = values[i][j];
      if (v === null) { g += `<rect x="${labelW + j * cw}" y="${top + i * ch}" width="${cw - 2}" height="${ch - 2}" rx="3" fill="transparent" stroke="var(--grid)"/>`; return; }
      const idx = Math.min(5, Math.floor((v / max) * 5.999));
      const dark = idx >= 3;
      g += `<rect x="${labelW + j * cw}" y="${top + i * ch}" width="${cw - 2}" height="${ch - 2}" rx="3" fill="${v === 0 ? 'var(--seq-0)' : steps[idx]}" data-tip="${tipData(`${r} · ${c}`, [[null, unit || 'Valeur', fmt(v)]])}"/>`;
      g += `<text x="${labelW + j * cw + (cw - 2) / 2}" y="${top + i * ch + ch / 2 + 3}" text-anchor="middle" class="mx-t ${dark ? 'hi' : 'lo'}" style="font-size:10.5px;pointer-events:none">${fmt(v)}</text>`;
    });
  });
  return `<div class="chart"><svg viewBox="0 0 ${labelW + cols.length * cw} ${height}" style="max-width:${labelW + cols.length * cw}px" role="img">${g}</svg></div>`;
}

/* Scatter with quadrant labels. points: [{x,y,label,color}] */
function scatter({ points, width = 440, height = 240, xFmt = fmtN, yFmt = fmtN, xLabel = '', yLabel = '', quad }) {
  const m = { t: 12, r: 12, b: 34, l: 46 };
  const iw = width - m.l - m.r, ih = height - m.t - m.b;
  const xmax = niceMax(Math.max(...points.map((p) => p.x))), ymax = niceMax(Math.max(...points.map((p) => p.y)));
  const x = (v) => m.l + (v / xmax) * iw, y = (v) => m.t + ih - (v / ymax) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = (ymax * k) / 4; g += `<line x1="${m.l}" x2="${width - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${y(v) + 3.5}" text-anchor="end">${yFmt(v)}</text>`; }
  for (let k = 0; k <= 4; k++) { const v = (xmax * k) / 4; g += `<text x="${x(v)}" y="${height - 18}" text-anchor="middle">${xFmt(v)}</text>`; }
  g += `<text x="${m.l + iw / 2}" y="${height - 3}" text-anchor="middle">${esc(xLabel)}</text><text x="${m.l}" y="${m.t - 2}" >${esc(yLabel)}</text>`;
  if (quad) g += `<text x="${width - m.r - 4}" y="${y(0) - 6}" text-anchor="end" class="lbl-strong">${esc(quad)}</text>`;
  points.forEach((p) => { g += `<circle cx="${x(p.x)}" cy="${y(p.y)}" r="5" fill="${p.color || 'var(--accent)'}" stroke="var(--surface)" stroke-width="2" data-tip="${tipData(p.label, [[null, xLabel, xFmt(p.x)], [null, yLabel, yFmt(p.y)]])}"/>`; });
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img">${g}</svg></div>`;
}

/* Gantt-like session timeline for one evening */
function sessionTimeline({ rows, fromH = 18, toH = 24, width = 940 }) {
  const lw = 90, rh = 26, top = 18, height = top + rows.length * rh + 6;
  const x = (h) => lw + ((h - fromH) / (toH - fromH)) * (width - lw - 8);
  let g = '';
  for (let h = fromH; h <= toH; h++) g += `<line x1="${x(h)}" x2="${x(h)}" y1="${top - 4}" y2="${height}" stroke="var(--grid)"/><text x="${x(h)}" y="11" text-anchor="middle">${fmtHour(h % 24)}</text>`;
  rows.forEach((r, i) => {
    g += `<text class="lbl" x="${lw - 10}" y="${top + i * rh + 16}" text-anchor="end">${esc(r.user)}</text>`;
    r.spans.forEach((s) => { g += `<rect x="${x(s.a)}" y="${top + i * rh + 5}" width="${Math.max(3, x(s.b) - x(s.a) - 2)}" height="14" rx="4" fill="${TYPE[s.t].color}" data-tip="${tipData(s.label, [[TYPE[s.t].color, TYPE[s.t].label, `${fmtHour(Math.floor(s.a))}${String(Math.round((s.a % 1) * 60)).padStart(2, '0')} → ${fmtHour(Math.floor(s.b) % 24)}${String(Math.round((s.b % 1) * 60)).padStart(2, '0')}`]])}"/>`; });
  });
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Frise des lectures">${g}</svg></div>`;
}

/* Small multiples: one tiny column chart per series, shared y scale */
function smallMultiples(items, { width = 290, height = 110 } = {}) {
  const max = Math.max(...items.flatMap((it) => it.values));
  return `<div class="doc-grid g3">${items.map((it) => `<div><div class="row" style="justify-content:space-between;font-size:var(--fs-sm);margin-bottom:4px"><span class="tkey"><i style="background:${it.color}"></i>${it.name}</span><span class="muted">pic ${fmtHour(it.values.indexOf(Math.max(...it.values)))}</span></div>${columnsScaled(it.values, max, it.color, width, height, it.name)}</div>`).join('')}</div>`;
}
function columnsScaled(values, max, color, width, height, name) {
  const m = { t: 4, b: 16, l: 2, r: 2 }, ih = height - m.t - m.b, band = (width - m.l - m.r) / values.length, bw = Math.max(2, Math.min(10, band - 2));
  let g = '';
  values.forEach((v, i) => { const h = (v / max) * ih; g += `<path d="${barPath(m.l + band * i + (band - bw) / 2, m.t + ih - h, bw, h, 2)}" fill="${color}"/><rect x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" data-tip="${tipData(`${name} · ${fmtHour(i)}`, [[color, 'Vues', fmtN(v)]])}"/>`; });
  g += `<line x1="0" x2="${width}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  [0, 6, 12, 18].forEach((h) => { g += `<text x="${m.l + band * h + band / 2}" y="${height - 3}" text-anchor="middle" style="font-size:10px">${fmtHour(h)}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img">${g}</svg></div>`;
}

    ${spec(`${newBadge} Panneau latéral (piste, ligne d’historique)`, `<div class="card" style="box-shadow:var(--shadow-pop)"><div class="card-h"><div class="row" style="gap:10px">${art('Halo', 'square')}<div><h3>Basse lumière</h3><div class="sub">Lune Pâle · Halo</div></div></div><button class="btn btn-ghost btn-icon btn-sm">${ic('x', 14)}</button></div><div class="card-b"><div class="stat-strip" style="--n:3;border:1px solid var(--border);border-radius:var(--r-lg)">${statTile({ label: 'Écoutes', value: '96' })}${statTile({ label: 'Skip', value: '36', unit: '%' })}${statTile({ label: 'Auditeurs', value: '2' })}</div><div class="note">Dernières écoutes : Hugo il y a 2 h, Céline hier…</div></div></div><p class="note">Remplace une page « piste » : s’ouvre par-dessus l’album, l’URL garde <code>?track=…</code>.</p>`)}
    ${spec(`${newBadge} Comparaison de deux utilisateurs`, `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="row" style="gap:8px">${avatar(USERS[2])}<b>Léa</b></span><span class="muted">vs</span><span class="row" style="gap:8px"><b>Hugo</b>${avatar(USERS[3])}</span></div><div class="stack" style="gap:8px;font-size:var(--fs-md)">${[['Temps', '190 h', '121 h', .61], ['Complétion', '82 %', '64 %', .56], ['Part de séries', '71 %', '38 %', .65]].map(([l, a, b, r]) => `<div><div class="row" style="justify-content:space-between"><span class="num">${a}</span><span class="muted">${l}</span><span class="num">${b}</span></div><div style="display:flex;gap:2px;height:6px;margin-top:4px"><span style="flex:${r};background:${USERS[2].color};border-radius:3px 0 0 3px"></span><span style="flex:${1 - r};background:${USERS[3].color};border-radius:0 3px 3px 0"></span></div></div>`).join('')}</div><p class="note">12 contenus en commun · affinité 64 %</p>`)}
    ${spec(`${newBadge} Annotations sur un graphique`, lineChart({ labels: DAYLBL, series: [{ name: 'Temps de lecture', color: 'var(--accent)', values: totDaily.map((v) => v / 3600) }], yFmt: (v) => `${fmtN(v)} h`, width: 520, height: 170, xEvery: 7 }).replace('</svg>', `<line x1="${46 + (13 * (520 - 58)) / 29}" x2="${46 + (13 * (520 - 58)) / 29}" y1="10" y2="144" stroke="var(--ink-3)" stroke-width="1"/><text x="${50 + (13 * (520 - 58)) / 29}" y="20" class="lbl">+23 films ajoutés</text></svg>`) + `<p class="note">Événements (synchro, ajouts massifs, mise à jour Jellyfin, panne) en filets verticaux étiquetés.</p>`)}
    ${spec(`${newBadge} Série en cours & records`, `<div class="row" style="gap:16px"><div class="row" style="gap:10px"><span style="width:36px;height:36px;border-radius:var(--r-lg);border:1px solid var(--border);display:grid;place-items:center;color:var(--serious-ink)">${ic('flame', 18)}</span><div><div class="stat-value" style="font-size:var(--fs-xl)">9 jours</div><div class="muted" style="font-size:var(--fs-sm)">d’affilée · record 23</div></div></div><div style="display:flex;gap:3px">${Array.from({ length: 14 }, (_, i) => `<span style="width:10px;height:22px;border-radius:3px;background:${i > 4 ? 'var(--accent)' : 'var(--surface-3)'}"></span>`).join('')}</div></div>`)}
    ${spec(`${newBadge} Notification de jalon`, `<div class="stack"><div class="toast">${ic('sparkle')}Léa vient de dépasser 1 000 h de lecture</div><div class="toast">${ic('flame')}Nouveau record : 6 lectures simultanées</div></div><p class="note">Aussi envoyables par webhook Discord.</p>`)}
    ${spec(`${newBadge} Barre de filtres (une seule rangée)`, `<div class="row"><button class="btn btn-secondary btn-sm">${ic('calendar', 14)}30 j${ic('chevD', 12)}</button><span class="chip" aria-pressed="true">Séries ${ic('x', 12)}</span><span class="chip">Léa ${ic('x', 12)}</span><span class="chip">+ Filtre</span><button class="btn btn-ghost btn-sm" style="margin-left:auto">Tout effacer</button><button class="btn btn-ghost btn-icon btn-sm" title="Copier le lien">${ic('share', 14)}</button></div><p class="note">Chaque filtre est dans l’URL ; « Copier le lien » partage exactement la vue.</p>`)}
    ${spec(`${newBadge} Vue tableau d’un graphique`, `<div class="row" style="justify-content:flex-end;margin-bottom:8px">${seg([ic('insights', 14) + ' Graphique', ic('list', 14) + ' Tableau'], 1)}</div><table class="table table-dense"><thead><tr><th>Jour</th><th class="num">Temps</th><th class="num">Vues</th></tr></thead><tbody>${DAYLBL.slice(-4).map((d, i) => `<tr style="cursor:default"><td>${d}</td><td class="num">${fmtDur(totDaily[26 + i])}</td><td class="num">${dailyViews[26 + i]}</td></tr>`).join('')}</tbody></table><p class="note">Accessibilité : chaque graphique a sa vue tableau (et l’export CSV).</p>`)}
  </div>`;

  /* --- Backend capture --- */
  const capture = [
    ['Piste audio choisie', 'PlayState.AudioStreamIndex', 'VO / VF par utilisateur, langues', 'colonne + champ tracker'],
    ['Sous-titres choisis', 'PlayState.SubtitleStreamIndex', 'Usage des sous-titres, PGS incrustés', 'colonne + champ tracker'],
    ['Raisons du transcodage', 'TranscodingInfo.TranscodeReasons', '« Pourquoi ça transcode »', 'colonne JSON'],
    ['Débit', 'TranscodingInfo.Bitrate · MediaSource.Bitrate', 'Bande passante live et historique', 'colonne'],
    ['Accélération matérielle', 'TranscodingInfo.HardwareAccelerationType', 'Charge CPU vs GPU', 'colonne'],
    ['Plage vidéo (HDR)', 'MediaStream.VideoRange / VideoRangeType', 'Part HDR, tone mapping', 'déjà dans MediaStreams : à typer'],
    ['Nombre de pauses', 'transitions IsPaused entre polls', 'Comportement de pause', 'compteur watchdog'],
    ['Géolocalisation', 'RemoteEndPoint → /utils/geolocateIp', 'Local / distant, carte', 'cache IP → lieu'],
  ];

  return `
  <h1 class="doc-h1">Nouveautés ${newBadge}</h1>
  <p class="doc-lead">Tout ce que les données de Jellystics permettent d’ajouter et qui n’existe pas encore : ${'graphiques'} et composants, rangés par page de destination. Chaque carte dit à quelle question elle répond, quelle donnée elle utilise, si cette donnée est <b>déjà collectée</b> ou <b>à capter</b>, et où elle vivrait.</p>
  <div class="card"><div class="stat-strip" style="--n:4">
    ${statTile({ label: 'Graphiques proposés', value: String(overview.length + behaviour.length + catalog.length + quality.length + people.length + music.length) })}
    ${statTile({ label: 'Composants proposés', value: '8' })}
    ${statTile({ label: 'Faisables tout de suite', value: String(NSTATES.filter((s) => s !== 'todo').length), foot: 'données déjà collectées ou synchronisées' })}
    ${statTile({ label: 'Champs à capter', value: String(capture.length), foot: 'déjà renvoyés par /Sessions' })}
  </div></div>
  <div class="page-pick" style="margin-top:var(--s-4)">${['Vue d’ensemble & live', 'Comportements', 'Catalogue', 'Qualité & langues', 'Utilisateurs & réseau', 'Musique', 'Composants', 'Données à capter'].map((t) => `<a class="chip" href="javascript:void 0" data-jump="new-${t.toLowerCase().replace(/[^a-z]+/g, '-')}">${t}</a>`).join('')}</div>
  ${ngroup('Vue d’ensemble & live', 'Ce qui se passe maintenant et le dimensionnement du serveur.', overview)}
  ${ngroup('Comportements', 'Comment on regarde : durée des séances, reprises, cadence, faux départs, revisionnages.', behaviour)}
  ${ngroup('Catalogue', 'Croiser les lectures avec la bibliothèque synchronisée (année, genres, taille, date d’ajout, date de sortie).', catalog)}
  ${ngroup('Qualité & langues', 'Ce que le serveur sert vraiment : résolution, HDR, codecs, langues.', quality)}
  ${ngroup('Utilisateurs & réseau', 'Qui, depuis où, sur quoi.', people)}
  ${ngroup('Musique', 'Les spécificités de l’écoute : skip, découverte, albums entiers, classements.', music)}
  <h2 class="doc-h2" id="new-composants">Composants</h2><p class="doc-sub">Les briques d’interface nouvelles, dans la même DA.</p>
  ${comps}
  <h2 class="doc-h2" id="new-donn-es-capter">Données à capter</h2><p class="doc-sub">Champs déjà renvoyés par <code>GET /Sessions</code> que le tracker n’enregistre pas encore. Une migration et quelques lignes dans <code>tracker.go</code>.</p>
  ${card('', '', `<table class="table" style="cursor:default"><thead><tr><th>Donnée</th><th>Source Jellyfin</th><th>Débloque</th><th>Travail</th></tr></thead><tbody>${capture.map(([a, b, c, d]) => `<tr style="cursor:default"><td style="font-weight:550">${newBadge} ${a}</td><td class="mono" style="font-size:12px">${b}</td><td class="ink2" style="white-space:normal">${c}</td><td class="muted">${d}</td></tr>`).join('')}</tbody></table>`, { flush: true })}`;
}
/* ---------- boot ---------- */
const RENDER = { audit: renderAudit, foundations: renderFoundations, components: renderComponents, charts: renderCharts, architecture: renderArchitecture, new: renderNew };
const rendered = {};
function route() {
  const h = (location.hash || '#audit').slice(1);
  const [sec, sub] = h.split('/');
  const key = RENDER[sec] || sec === 'pages' ? sec : 'audit';
  $$('.doc-section').forEach((s) => s.classList.toggle('active', s.id === 's-' + key));
  $$('.doc-nav a').forEach((a) => a.setAttribute('aria-current', a.getAttribute('href').slice(1).split('/')[0] === key ? 'page' : 'false'));
  if (key === 'pages') {
    $('#s-pages').innerHTML = renderPages(sub || 'overview');
    const p = PAGES[sub || 'overview'];
    if (p && p.after) p.after();
  } else if (!rendered[key]) { $('#s-' + key).innerHTML = RENDER[key](); rendered[key] = true; }
  tip.classList.remove('on');
  if (!h.includes('/') || sec !== 'pages' || !route.inPages) window.scrollTo(0, 0);
  route.inPages = key === 'pages';
}
// segmented / tabs / chips: purely visual toggles in the mock
document.addEventListener('click', (e) => {
  const b = e.target.closest('.seg button');
  if (b) { b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); }
  const t = e.target.closest('.tabs button');
  if (t) { t.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-selected', x === t)); }
  const sw = e.target.closest('.switch');
  if (sw) sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') !== 'true');
  const j = e.target.closest('[data-jump]');
  if (j) { const el = document.getElementById(j.dataset.jump); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 64, behavior: 'smooth' }); }
  const a = e.target.closest('a[href="javascript:void 0"]');
  if (a) e.preventDefault();
});
// theme toggle (stamp on <html>, remembered per viewer)
const themeBtn = $('#theme');
function currentTheme() { const s = document.documentElement.dataset.theme; return s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function paintThemeBtn() { themeBtn.innerHTML = ic(currentTheme() === 'dark' ? 'sun' : 'moon'); }
try { const saved = localStorage.getItem('jellystics-ds-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch {}
themeBtn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('jellystics-ds-theme', next); } catch {}
  paintThemeBtn();
});
paintThemeBtn();
addEventListener('hashchange', route);
route();

</script>
</body>
</html>
